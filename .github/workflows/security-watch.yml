name: Security watch

# Daily passive check of all public sites (uptime, TLS expiry, security
# headers, SPF/DMARC). Dependency alerts run in the private dev repo. A failed run
# makes GitHub email the repo owner automatically.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sites:
    name: Sites, TLS, DNS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y -qq dnsutils >/dev/null || true
      - run: bash .github/security/check.sh

